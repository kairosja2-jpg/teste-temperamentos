<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teste de Temperamento — Resultado + Livro recomendado</title>
  <meta name="description" content="Faça o teste de temperamento (25 perguntas) e veja seu resultado com recomendação do livro ideal." />

  <style>
    :root{
      --bg1:#070B14;
      --bg2:#0B1630;
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.72);
      --accent:#78C7FF;
      --accent2:#A6FFCB;
      --radius:18px;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(120,199,255,.16), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, rgba(166,255,203,.12), transparent 55%),
        radial-gradient(900px 700px at 60% 90%, rgba(170,120,255,.10), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
      overflow-x:hidden;
    }
